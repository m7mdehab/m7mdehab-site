        kind: "original conceptual system diagram"
        status: public_safe_derived
        source: "public docs/ARCHITECTURE_CURRENT.md"
        priority: primary
        use: "Create an original provenance-first workflow visualization; label as architecture/system flow, never as a product screenshot."
      - id: opportunityos-action-modes
