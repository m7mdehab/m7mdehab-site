# Project evidence and visual-asset registry for m7mdehab.com
# Updated: 2026-09-09
#
# This file governs what may be used as project proof and how it may be visualized.
# It complements data/source-of-truth.public.yaml; it does not replace factual truth governance.
# Internal asset names are recorded without private Drive URLs/IDs. Presence in an internal corpus
# does not by itself authorize publishing the original bytes.

meta:
  canonical_name: "Mohammed Ehab ElNomany"
  updated: "2026-09-09"
  purpose: "Evidence provenance, visual selection, publication safety and service-proof coverage."
  statuses:
    public_repo_asset: "Already published in Mohammed's public repository; eligible for use subject to source/asset licence context."
    public_code_renderable: "Public source/data can be rendered or captured into a first-party visual."
    public_live_capture: "Public live product/page may be captured as portfolio evidence; do not extract unrelated third-party imagery as a standalone reusable asset."
    public_safe_derived: "Create an original visual only from explicitly public-safe facts; never imply it is a product screenshot."
    internal_candidate: "Useful internal evidence/visual candidate; original bytes must not ship until publication rights are explicitly established."
    evidence_only: "Supports a claim but is not itself a suitable visual asset."
    reject: "Do not use publicly."

