projects:
  - id: presaira
    title: "Presaira"
    proof_theme: "Probabilistic systems that remain inspectable after reality happens."
    service_support: ["ml-ai-product-development", "product-web-development"]
    source_classification: public
    sources:
      - "https://github.com/m7mdehab/WC2026-Live-Prediction-Engine"
      - "https://presaira.com"
    verified_proof:
      - "Forecast all 104 World Cup 2026 matches."
      - "Dixon-Coles goal model blended with Elo."
      - "50,000-iteration full-tournament Monte Carlo simulation."
      - "Committed calibration/backtest artifacts and postmortem."
      - "Reproducible/versioned runs and automated tests."
    visual_candidates:
      - id: presaira-live-product
        kind: "live product capture"
        status: public_live_capture
        source: "presaira.com"
        priority: primary
        use: "Current interface/product context, captured at implementation time."
      - id: presaira-probability-trajectory
        kind: "interactive chart"
        status: public_code_renderable
        source: "web/src/components/home/ProbabilityOverTimeChart.tsx"
        priority: primary
        use: "Animate or progressively reveal real champion-probability trajectories; static SVG/table fallback for reduced motion."
      - id: presaira-reliability
        kind: "calibration/reliability chart"
        status: public_code_renderable
        source: "web/src/components/methodology/ReliabilityChart.tsx + web/public/methodology/reliability_2026.csv"
        priority: secondary
        use: "Technical proof that the system evaluates calibration rather than presenting confidence theater."
      - id: presaira-bracket
        kind: "tournament bracket"
        status: public_code_renderable
        source: "web/src/components/bracket/DesktopBracket.tsx"
        priority: supporting
        use: "Contextual product proof; not the homepage's dominant football motif."
    interaction_direction: "A restrained probability line develops with scroll/hover and resolves into evaluation evidence; motion must communicate forecast change, not act as ambient decoration."
    avoid:
      - "generic football poster treatment"
      - "future-tense prediction copy"
      - "fake live odds"
      - "sports-betting visual language"

