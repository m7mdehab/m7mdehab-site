name: Iteration 9 Temporary Soft Launch

on:
  push:
    branches:
      - iteration-9-production-deployment-soft-launch
    paths:
      - .github/workflows/iteration9-temporary-soft-launch.yml

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  temporary-deploy:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static soft-launch artifact
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify noindex preview policy is present
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'https://:version.:subdomain.workers.dev/*' out/_headers
          grep -F 'X-Robots-Tag: noindex' out/_headers

      - name: Deploy temporary Cloudflare preview
        run: npx --yes wrangler@4.130.0 deploy --temporary --config wrangler.static.jsonc
