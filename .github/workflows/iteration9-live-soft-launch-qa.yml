name: Iteration 9 Live Soft Launch QA

on:
  push:
    branches:
      - iteration-9-production-deployment-soft-launch
    paths:
      - .github/workflows/iteration9-live-soft-launch-qa.yml

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  SOFT_LAUNCH_URL: https://m7mdehab-site.superb-trumpet.workers.dev

jobs:
  live-qa:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Record edge response without treating temporary-account challenge as app failure
        shell: bash
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error --location --dump-header /tmp/soft-launch-headers.txt --output /tmp/soft-launch-body.txt --write-out '%{http_code}' "$SOFT_LAUNCH_URL/")"
          cat /tmp/soft-launch-headers.txt
          echo "HTTP status: $status"
          if grep -qi '^cf-mitigated: challenge' /tmp/soft-launch-headers.txt; then
            echo "Cloudflare temporary-account edge challenge detected before Worker response."
          fi

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Probe temporary deployment with real Chromium
        shell: bash
        run: |
          node - <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const url = process.env.SOFT_LAUNCH_URL;
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ locale: 'en-US', colorScheme: 'light' });
            const response = await page.goto(url, { waitUntil: 'domcontentloaded', timeout: 45000 });
            console.log('initial status:', response?.status());
            for (let i = 0; i < 12; i += 1) {
              const title = await page.title();
              const text = (await page.locator('body').innerText().catch(() => '')) ?? '';
              console.log(`probe ${i + 1}:`, { title, url: page.url() });
              if (/Mohammed Ehab/i.test(title) || /Mohammed Ehab ElNomany/i.test(text)) {
                console.log('Temporary deployment reached application content through Chromium.');
                await browser.close();
                process.exit(0);
              }
              await page.waitForTimeout(2500);
            }
            console.error('Temporary deployment remained behind Cloudflare managed challenge.');
            await browser.close();
            process.exit(2);
          })();
          NODE

      - name: Run full browser suite against deployed preview
        env:
          BASE_URL: ${{ env.SOFT_LAUNCH_URL }}
        run: npm run test:browser

      - name: Capture live Lighthouse baselines
        shell: bash
        run: |
          mkdir -p artifacts/live-lighthouse
          npx lighthouse "$SOFT_LAUNCH_URL/" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/live-lighthouse/home.json
          npx lighthouse "$SOFT_LAUNCH_URL/work/presaira" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/live-lighthouse/presaira.json
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['home', 'presaira']) {
            const report = JSON.parse(fs.readFileSync(`artifacts/live-lighthouse/${name}.json`, 'utf8'));
            const categories = Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, Math.round((value.score ?? 0) * 100)]));
            console.log(`${name}:`, { benchmarkIndex: report.environment?.benchmarkIndex ?? null, ...categories });
          }
          NODE
