name: Deploy Cloudflare Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Deploy m7mdehab.com
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production static artifact
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/profile.json
          test -f out/projects.json
          test -f out/services.json
          test -f out/writing.json
          test -f out/llms.txt
          test -f out/_headers

          assert_export() {
            local file="$1"
            local directory_index="$2"
            local label="$3"
            if [ -f "$file" ]; then
              echo "$label: file form"
            elif [ -f "$directory_index" ]; then
              echo "$label: directory-index form"
            else
              echo "Missing $label export" >&2
              exit 1
            fi
          }

          assert_export out/ar.html out/ar/index.html "Arabic homepage"
          assert_export out/ar/work/presaira.html out/ar/work/presaira/index.html "Arabic Presaira case study"
          assert_export out/writing.html out/writing/index.html "English writing hub"
          assert_export out/writing/when-to-trust-a-probabilistic-forecast.html out/writing/when-to-trust-a-probabilistic-forecast/index.html "English authority essay"
          assert_export out/ar/writing.html out/ar/writing/index.html "Arabic writing hub"
          assert_export out/ar/writing/when-to-trust-a-probabilistic-forecast.html out/ar/writing/when-to-trust-a-probabilistic-forecast/index.html "Arabic authority essay"

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.production.jsonc