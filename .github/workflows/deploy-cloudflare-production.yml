name: Deploy Cloudflare Production

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  deploy:
    name: Deploy m7mdehab.com
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production static artifact
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/profile.json
          test -f out/projects.json
          test -f out/services.json
          test -f out/llms.txt
          test -f out/_headers
          if [ -f out/ar.html ]; then
            echo "Arabic homepage export: file form"
          elif [ -f out/ar/index.html ]; then
            echo "Arabic homepage export: directory-index form"
          else
            echo "Missing Arabic homepage export" >&2
            exit 1
          fi
          if [ -f out/ar/work/presaira.html ]; then
            echo "Arabic Presaira export: file form"
          elif [ -f out/ar/work/presaira/index.html ]; then
            echo "Arabic Presaira export: directory-index form"
          else
            echo "Missing Arabic Presaira case study export" >&2
            exit 1
          fi

      - name: Deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.production.jsonc
