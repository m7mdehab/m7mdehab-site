name: Deploy Cloudflare Production

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  PROD_BASE_URL: https://m7mdehab.com

jobs:
  deploy:
    name: Deploy and verify m7mdehab.com
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: production
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build production static artifact
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify production artifact
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html robots.txt sitemap.xml profile.json projects.json services.json writing.json llms.txt _headers; do test -f "out/$file"; done
          grep -F 'https://:version.:subdomain.workers.dev/*' out/_headers
          grep -F 'X-Robots-Tag: noindex' out/_headers

          assert_export() {
            local file="$1" directory_index="$2" label="$3"
            if [ -f "$file" ]; then echo "$label: file form"
            elif [ -f "$directory_index" ]; then echo "$label: directory-index form"
            else echo "Missing $label export" >&2; find out -maxdepth 6 -type f | sort; exit 1; fi
          }
          assert_export out/about.html out/about/index.html "English About"
          assert_export out/work.html out/work/index.html "English work directory"
          assert_export out/services.html out/services/index.html "English services"
          assert_export out/writing.html out/writing/index.html "English writing hub"
          test ! -f out/ar.html
          test ! -f out/ar/index.html
          test ! -f out/prototypes.html
          test ! -f out/prototypes/index.html
          test ! -f out/prototypes/cinematic.html
          test ! -f out/prototypes/cinematic/index.html
          if grep -Fq '/ar' out/sitemap.xml; then echo "Production sitemap artifact still exposes Arabic routes" >&2; exit 1; fi
          if grep -Fq '/prototypes' out/sitemap.xml; then echo "Production sitemap exposes retired prototypes" >&2; exit 1; fi
          test "$(grep -o '<url>' out/sitemap.xml | wc -l | tr -d ' ')" = "14"

      - name: Deploy to Cloudflare production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.production.jsonc

      - name: Verify live production routes, indexing, security, canonical, and retired surfaces
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/production-verification

          assert_stable_status() {
            local route="$1" expected="$2" label="$3"
            local consecutive=0 last_status=unset
            for attempt in {1..45}; do
              last_status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$PROD_BASE_URL${route}" || true)"
              echo "$label attempt ${attempt}: ${route} -> HTTP ${last_status} (expected ${expected})"
              if [ "$last_status" = "$expected" ]; then
                consecutive=$((consecutive + 1))
                if [ "$consecutive" -ge 2 ]; then return 0; fi
              else
                consecutive=0
              fi
              sleep 4
            done
            echo "$label did not stabilize: ${route} expected ${expected}, last ${last_status}" >&2
            return 1
          }

          assert_stable_status "/" "200" "Production root"
          curl --fail --silent --show-error --location --dump-header /tmp/prod-headers.txt --output /tmp/prod-home.html "$PROD_BASE_URL/"
          tr -d '\r' < /tmp/prod-headers.txt > artifacts/production-verification/home-headers.txt
          cp /tmp/prod-home.html artifacts/production-verification/home.html

          if grep -Eiq '^x-robots-tag:.*noindex' artifacts/production-verification/home-headers.txt; then echo "Production must not emit X-Robots-Tag: noindex" >&2; exit 1; fi
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' artifacts/production-verification/home-headers.txt
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' artifacts/production-verification/home-headers.txt
          grep -Eiq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' artifacts/production-verification/home-headers.txt

          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/prod-home.html', 'utf8');
          if (!html.includes('<link rel="canonical" href="https://m7mdehab.com"')) throw new Error('Production homepage canonical is not the production apex URL');
          if (/hreflang=["']ar["']/i.test(html)) throw new Error('Production homepage still advertises Arabic hreflang');
          if (/href=["']\/ar(?:["'/?#])/i.test(html)) throw new Error('Production homepage still links to Arabic');
          const visibleText = html.replace(/<script[\s\S]*?<\/script>/gi, ' ').replace(/<style[\s\S]*?<\/style>/gi, ' ').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
          for (const needle of ['Different problems. One standard.', 'I like the messy part.', 'Ideas, lessons and field notes.', 'Choose the right conversation.']) {
            if (!visibleText.includes(needle)) throw new Error(`Production homepage missing accepted visible marker: ${needle}`);
          }
          if (html.includes('—')) throw new Error('Production homepage contains a prohibited em dash');
          if (html.includes('WordPress')) throw new Error('Production homepage contains the removed WordPress claim');
          const css = [...html.matchAll(/href=["']([^"']*\/_next\/static\/[^"']+\.css[^"']*)/gi)].map((m) => m[1]);
          const js = [...html.matchAll(/src=["']([^"']*\/_next\/static\/[^"']+\.js[^"']*)/gi)].map((m) => m[1]);
          if (!css.length) throw new Error('Production homepage exposes no content-addressed CSS assets');
          fs.writeFileSync('artifacts/production-verification/assets.json', JSON.stringify({ css, js }, null, 2));
          NODE

          routes=(
            "/" "/about" "/work"
            "/work/presaira" "/work/opportunityos" "/work/ghareeb-oglu"
            "/work/oil-spill-detection" "/work/solar-site-selection" "/work/makhbazy"
            "/services" "/writing"
            "/writing/when-to-trust-a-probabilistic-forecast"
            "/writing/why-accuracy-is-not-enough-for-oil-spill-detection"
            "/writing/what-an-ai-agent-should-do-when-evidence-is-missing"
            "/profile.json" "/projects.json" "/services.json" "/writing.json"
            "/llms.txt" "/robots.txt" "/sitemap.xml"
          )
          : > artifacts/production-verification/routes.tsv
          for route in "${routes[@]}"; do
            assert_stable_status "$route" "200" "Published route"
            printf '%s\t200\n' "$route" >> artifacts/production-verification/routes.tsv
          done

          html_routes=(
            "/" "/about" "/work"
            "/work/presaira" "/work/opportunityos" "/work/ghareeb-oglu"
            "/work/oil-spill-detection" "/work/solar-site-selection" "/work/makhbazy"
            "/services" "/writing"
            "/writing/when-to-trust-a-probabilistic-forecast"
            "/writing/why-accuracy-is-not-enough-for-oil-spill-detection"
            "/writing/what-an-ai-agent-should-do-when-evidence-is-missing"
          )
          for route in "${html_routes[@]}"; do
            if curl --fail --silent --show-error "$PROD_BASE_URL${route}" | grep -Fq '—'; then
              echo "Public production HTML contains a prohibited em dash: ${route}" >&2
              exit 1
            fi
          done

          retired_routes=(
            "/ar" "/ar/about" "/ar/work" "/ar/work/presaira" "/ar/services" "/ar/writing" "/ar/writing/when-to-trust-a-probabilistic-forecast"
            "/prototypes" "/prototypes/cinematic" "/prototypes/spatial" "/prototypes/kinetic"
          )
          : > artifacts/production-verification/retired-routes.tsv
          for route in "${retired_routes[@]}"; do
            assert_stable_status "$route" "404" "Retired route"
            printf '%s\t404\n' "$route" >> artifacts/production-verification/retired-routes.tsv
          done

          curl --fail --silent --show-error "$PROD_BASE_URL/robots.txt" > artifacts/production-verification/robots.txt
          if grep -Eq '^Disallow:[[:space:]]*/[[:space:]]*$' artifacts/production-verification/robots.txt; then echo "robots.txt blocks the production site" >&2; exit 1; fi
          curl --fail --silent --show-error "$PROD_BASE_URL/sitemap.xml" > artifacts/production-verification/sitemap.xml
          if grep -Fq '/ar' artifacts/production-verification/sitemap.xml; then echo "Live sitemap still exposes Arabic routes" >&2; exit 1; fi
          if grep -Fq '/prototypes' artifacts/production-verification/sitemap.xml; then echo "Live sitemap exposes retired prototypes" >&2; exit 1; fi
          test "$(grep -o '<url>' artifacts/production-verification/sitemap.xml | wc -l | tr -d ' ')" = "14"

      - name: Install Chromium for production acceptance
        run: npx playwright install --with-deps chromium

      - name: Playwright rendered and accessibility QA against production
        env:
          BASE_URL: ${{ env.PROD_BASE_URL }}
        run: npm run test:browser

      - name: Capture real production screenshot matrix
        shell: bash
        run: |
          mkdir -p artifacts/production-verification/screenshots
          capture() {
            local path="$1" name="$2" width="$3" height="$4"
            npx playwright screenshot --browser=chromium --viewport-size="${width},${height}" --full-page "$PROD_BASE_URL${path}" "artifacts/production-verification/screenshots/${name}-${width}.png"
          }
          capture "/" home 1920 1080
          capture "/" home 430 932
          capture "/" home 390 844
          capture "/about" about 1920 1080
          capture "/about" about 390 844
          capture "/work" work 1920 1080
          capture "/work" work 390 844
          capture "/services" services 1920 1080
          capture "/services" services 390 844
          capture "/writing" writing 1920 1080
          capture "/writing" writing 390 844
          capture "/work/opportunityos" opportunityos 1920 1080
          capture "/work/opportunityos" opportunityos 390 844
          capture "/writing/when-to-trust-a-probabilistic-forecast" article 1920 1080
          capture "/writing/when-to-trust-a-probabilistic-forecast" article 390 844

      - name: Lighthouse production baseline
        shell: bash
        run: |
          mkdir -p artifacts/production-lighthouse
          npx lighthouse "$PROD_BASE_URL/" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/production-lighthouse/home.json || true
          npx lighthouse "$PROD_BASE_URL/work/presaira" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/production-lighthouse/presaira.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['home', 'presaira']) {
            const file = `artifacts/production-lighthouse/${name}.json`;
            if (!fs.existsSync(file)) continue;
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, Math.round((value.score ?? 0) * 100)]));
            console.log(`${name}:`, categories);
          }
          NODE

      - name: Write final release evidence manifest
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/production-verification
          node - <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const readJson = (file) => { try { return JSON.parse(fs.readFileSync(file, 'utf8')); } catch { return null; } };
          const lighthouseScore = (name) => {
            const report = readJson(`artifacts/production-lighthouse/${name}.json`);
            if (!report) return null;
            return Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, Math.round((value.score ?? 0) * 100)]));
          };
          const parseRoutes = (file) => fs.existsSync(file)
            ? fs.readFileSync(file, 'utf8').trim().split('\n').filter(Boolean).map((line) => {
                const [route, status] = line.split('\t');
                return { route, status: Number(status) };
              })
            : [];
          const screenshotsDir = 'artifacts/production-verification/screenshots';
          const manifest = {
            contract: 'English public surface refined sitewide; Arabic and prototype routes retired',
            sha: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            baseUrl: process.env.PROD_BASE_URL,
            routes: parseRoutes('artifacts/production-verification/routes.tsv'),
            retiredRoutes: parseRoutes('artifacts/production-verification/retired-routes.tsv'),
            screenshots: fs.existsSync(screenshotsDir) ? fs.readdirSync(screenshotsDir).sort() : [],
            lighthouse: { home: lighthouseScore('home'), presaira: lighthouseScore('presaira') },
          };
          manifest.routeCount = manifest.routes.length;
          fs.writeFileSync(path.join('artifacts', 'production-verification', 'release-evidence.json'), JSON.stringify(manifest, null, 2));
          NODE

      - name: Upload production acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-production-acceptance-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 14
