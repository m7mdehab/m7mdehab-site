name: Generate Writing Narration

on:
  push:
    branches:
      - writing-article-system-v14-groundwork
    paths:
      - ".github/workflows/writing-audio.yml"
      - "scripts/generate-writing-audio.mjs"
      - "data/writing.ts"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: writing-audio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout narration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Restore Kokoro model cache
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-82m-v1-q8-${{ runner.os }}-node22

      - name: Install project dependencies
        run: npm ci

      - name: Install Kokoro generation tooling
        run: npm install --no-save --package-lock=false kokoro-js@1.2.1 @huggingface/transformers@3.8.1

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Verify ffmpeg
        run: |
          ffmpeg -version
          ffprobe -version

      - name: Generate female and male article narration
        env:
          KOKORO_CACHE_DIR: .cache/kokoro
        run: npm run writing:audio

      - name: Verify generated narration set
        run: |
          node - <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const manifestPath = path.resolve("public/audio/writing/manifest.json");
          if (!fs.existsSync(manifestPath)) throw new Error("Narration manifest missing.");
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          const expected = [
            "when-to-trust-a-probabilistic-forecast",
            "why-accuracy-is-not-enough-for-oil-spill-detection",
            "what-an-ai-agent-should-do-when-evidence-is-missing",
          ];
          for (const slug of expected) {
            const entry = manifest.articles?.[slug];
            if (!entry?.voices?.female || !entry?.voices?.male) {
              throw new Error(`Missing dual narration for ${slug}`);
            }
            for (const voice of ["female", "male"]) {
              const rel = entry.voices[voice].path.replace(/^\//, "");
              const full = path.resolve("public", rel.replace(/^audio\//, "audio/"));
              if (!fs.existsSync(full)) throw new Error(`Missing ${voice} audio for ${slug}: ${full}`);
              if (fs.statSync(full).size < 100000) throw new Error(`Audio file looks too small: ${full}`);
            }
          }
          console.log("Verified dual Kokoro narration for all current articles.");
          NODE

      - name: Commit generated narration
        run: |
          if git diff --quiet -- public/audio/writing && [ -z "$(git status --porcelain public/audio/writing)" ]; then
            echo "Narration assets already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/writing
          git commit -m "chore(writing): generate Kokoro article narration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
