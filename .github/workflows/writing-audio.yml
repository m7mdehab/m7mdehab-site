name: Generate Writing Narration

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/writing-audio.yml"
      - "scripts/generate-writing-audio.mjs"
      - "data/writing.ts"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: writing-audio-main
  cancel-in-progress: true

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: when-to-trust-a-probabilistic-forecast
            voice: female
          - slug: when-to-trust-a-probabilistic-forecast
            voice: male
          - slug: why-accuracy-is-not-enough-for-oil-spill-detection
            voice: female
          - slug: why-accuracy-is-not-enough-for-oil-spill-detection
            voice: male
          - slug: what-an-ai-agent-should-do-when-evidence-is-missing
            voice: female
          - slug: what-an-ai-agent-should-do-when-evidence-is-missing
            voice: male

    steps:
      - name: Checkout narration source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Restore Kokoro model cache
        uses: actions/cache@v4
        with:
          path: .cache/kokoro
          key: kokoro-model-shawnahmed-timestamped-v1-q8-${{ runner.os }}
          restore-keys: |
            kokoro-model-shawnahmed-timestamped-v1-q8-

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Kokoro generation tooling
        run: npm install --no-save --package-lock=false --no-audit --no-fund kokoro-js@1.2.1 @huggingface/transformers@3.8.1

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Generate one narration asset
        env:
          KOKORO_CACHE_DIR: .cache/kokoro
        run: npm run writing:audio -- --slug "${{ matrix.slug }}" --voice "${{ matrix.voice }}"

      - name: Stage narration artifact
        run: |
          mkdir -p "artifact/audio/writing/${{ matrix.slug }}"
          cp "public/audio/writing/${{ matrix.slug }}/${{ matrix.voice }}.mp3" "artifact/audio/writing/${{ matrix.slug }}/${{ matrix.voice }}.mp3"
          cp "public/audio/writing/${{ matrix.slug }}/${{ matrix.voice }}.timings.json" "artifact/audio/writing/${{ matrix.slug }}/${{ matrix.voice }}.timings.json"

      - name: Upload narration artifact
        uses: actions/upload-artifact@v7
        with:
          name: narration-${{ matrix.slug }}-${{ matrix.voice }}
          path: artifact
          if-no-files-found: error
          retention-days: 1

  commit:
    if: github.actor != 'github-actions[bot]'
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout narration source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install project dependencies
        run: npm ci --no-audit --no-fund

      - name: Ensure ffmpeg is available
        shell: bash
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi

      - name: Download generated narration
        uses: actions/download-artifact@v7
        with:
          pattern: narration-*
          path: public
          merge-multiple: true

      - name: Rebuild narration manifest
        run: npm run writing:audio -- --manifest-only

      - name: Verify generated narration is current
        run: npm run writing:audio:verify

      - name: Commit generated narration if needed
        id: narration_commit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          if ! git diff --quiet "$GITHUB_SHA" origin/main -- data/writing.ts scripts/generate-writing-audio.mjs; then
            echo "Narration inputs advanced while this run was generating. A newer narration run must publish the assets." >&2
            exit 1
          fi

          if git diff --quiet -- public/audio/writing && [ -z "$(git status --porcelain public/audio/writing)" ]; then
            echo "Narration assets already current."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/audio/writing
          git commit -m "chore(writing): refresh generated Kokoro narration"
          git rebase origin/main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Dispatch fresh staging and production deployments
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run deploy-cloudflare-staging.yml --ref main
          gh workflow run deploy-cloudflare-production.yml --ref main
          echo "Narration is current; fresh deployment workflows were dispatched from main."
