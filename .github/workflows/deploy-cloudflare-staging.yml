name: Deploy Cloudflare Staging

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "*.md"

permissions:
  contents: read

concurrency:
  group: cloudflare-staging
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  STAGING_BASE_URL: https://m7mdehab-site.m7mdehab.workers.dev

jobs:
  deploy-staging:
    name: Deploy and verify workers.dev staging
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout accepted candidate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || 'main' }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build staging static artifact
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify staging artifact and retired-route contract
        shell: bash
        run: |
          set -euo pipefail
          for file in index.html robots.txt sitemap.xml profile.json projects.json services.json writing.json llms.txt _headers; do test -f "out/$file"; done
          grep -F 'https://:version.:subdomain.workers.dev/*' out/_headers
          grep -F 'X-Robots-Tag: noindex' out/_headers

          assert_export() {
            local file="$1" directory_index="$2" label="$3"
            if [ -f "$file" ]; then echo "$label: file form"
            elif [ -f "$directory_index" ]; then echo "$label: directory-index form"
            else echo "Missing $label export" >&2; find out -maxdepth 6 -type f | sort; exit 1; fi
          }
          assert_export out/about.html out/about/index.html "English About"
          assert_export out/work.html out/work/index.html "English work directory"
          assert_export out/services.html out/services/index.html "English services"
          assert_export out/writing.html out/writing/index.html "English writing hub"
          assert_export out/writing/when-to-trust-a-probabilistic-forecast.html out/writing/when-to-trust-a-probabilistic-forecast/index.html "English authority essay"
          test ! -f out/ar.html
          test ! -f out/ar/index.html
          test ! -f out/prototypes.html
          test ! -f out/prototypes/index.html
          test ! -f out/prototypes/cinematic.html
          test ! -f out/prototypes/cinematic/index.html
          if grep -Fq '/ar' out/sitemap.xml; then echo "Staging sitemap still exposes Arabic routes" >&2; exit 1; fi
          if grep -Fq '/prototypes' out/sitemap.xml; then echo "Staging sitemap exposes retired prototypes" >&2; exit 1; fi
          test "$(grep -o '<url>' out/sitemap.xml | wc -l | tr -d ' ')" = "14"

      - name: Deploy to Cloudflare staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.static.jsonc

      - name: Verify live staging routes, headers, canonical isolation, and retired surfaces
        shell: bash
        run: |
          set -euo pipefail

          assert_stable_status() {
            local route="$1" expected="$2" label="$3"
            local consecutive=0 last_status=unset
            for attempt in {1..30}; do
              last_status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' "$STAGING_BASE_URL${route}" || true)"
              echo "$label attempt ${attempt}: ${route} -> HTTP ${last_status} (expected ${expected})"
              if [ "$last_status" = "$expected" ]; then
                consecutive=$((consecutive + 1))
                if [ "$consecutive" -ge 2 ]; then return 0; fi
              else
                consecutive=0
              fi
              sleep 2
            done
            echo "$label did not stabilize: ${route} expected ${expected}, last ${last_status}" >&2
            return 1
          }

          assert_stable_status "/" "200" "Staging root"
          curl --fail --silent --show-error --location --dump-header /tmp/staging-headers.txt --output /tmp/staging-home.html "$STAGING_BASE_URL/"
          tr -d '\r' < /tmp/staging-headers.txt > /tmp/staging-headers-normalized.txt
          grep -Eiq '^x-robots-tag:.*noindex' /tmp/staging-headers-normalized.txt
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/staging-headers-normalized.txt
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' /tmp/staging-headers-normalized.txt
          grep -Eiq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' /tmp/staging-headers-normalized.txt

          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/staging-home.html', 'utf8');
          if (!html.includes('<link rel="canonical" href="https://m7mdehab.com"')) throw new Error('Homepage canonical is not the production apex URL');
          if (html.includes('<link rel="canonical" href="https://m7mdehab-site.m7mdehab.workers.dev"')) throw new Error('Staging workers.dev URL must never become canonical');
          if (/hreflang=["']ar["']/i.test(html)) throw new Error('English homepage still advertises Arabic hreflang');
          if (/href=["']\/ar(?:["'/?#])/i.test(html)) throw new Error('English homepage still links to Arabic');
          if (html.includes('—')) throw new Error('English homepage contains a prohibited em dash');
          NODE

          routes=(
            "/" "/about" "/work"
            "/work/presaira" "/work/opportunityos" "/work/ghareeb-oglu"
            "/work/oil-spill-detection" "/work/solar-site-selection" "/work/makhbazy"
            "/services" "/writing"
            "/writing/when-to-trust-a-probabilistic-forecast"
            "/writing/why-accuracy-is-not-enough-for-oil-spill-detection"
            "/writing/what-an-ai-agent-should-do-when-evidence-is-missing"
            "/profile.json" "/projects.json" "/services.json" "/writing.json"
            "/llms.txt" "/robots.txt" "/sitemap.xml"
          )
          for route in "${routes[@]}"; do assert_stable_status "$route" "200" "Published route"; done

          retired_routes=(
            "/ar" "/ar/about" "/ar/work" "/ar/work/presaira" "/ar/services" "/ar/writing" "/ar/writing/when-to-trust-a-probabilistic-forecast"
            "/prototypes" "/prototypes/cinematic" "/prototypes/spatial" "/prototypes/kinetic"
          )
          for route in "${retired_routes[@]}"; do assert_stable_status "$route" "404" "Retired route"; done

      - name: Install Chromium for deployed-origin acceptance
        run: npx playwright install --with-deps chromium

      - name: Playwright rendered and accessibility QA against staging
        env:
          BASE_URL: ${{ env.STAGING_BASE_URL }}
        run: npm run test:browser

      - name: Capture staging acceptance screenshots
        shell: bash
        run: |
          mkdir -p artifacts/staging-screenshots
          capture() {
            local path="$1" name="$2" width="$3" height="$4"
            npx playwright screenshot --browser=chromium --viewport-size="${width},${height}" --full-page "$STAGING_BASE_URL${path}" "artifacts/staging-screenshots/${name}-${width}.png"
          }
          capture "/" home 1920 1080
          capture "/" home 390 844
          capture "/about" about 1920 1080
          capture "/about" about 390 844
          capture "/work" work 1920 1080
          capture "/work" work 390 844
          capture "/services" services 1920 1080
          capture "/services" services 390 844
          capture "/writing" writing 1920 1080
          capture "/writing" writing 390 844
          capture "/work/opportunityos" opportunityos 1920 1080
          capture "/work/opportunityos" opportunityos 390 844
          capture "/writing/when-to-trust-a-probabilistic-forecast" article 1920 1080
          capture "/writing/when-to-trust-a-probabilistic-forecast" article 390 844

      - name: Lighthouse staging baseline
        shell: bash
        run: |
          mkdir -p artifacts/staging-lighthouse
          npx lighthouse "$STAGING_BASE_URL/" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/staging-lighthouse/home.json || true
          npx lighthouse "$STAGING_BASE_URL/work/presaira" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/staging-lighthouse/presaira.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['home', 'presaira']) {
            const file = `artifacts/staging-lighthouse/${name}.json`;
            if (!fs.existsSync(file)) continue;
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = Object.fromEntries(Object.entries(report.categories).map(([key, value]) => [key, Math.round((value.score ?? 0) * 100)]));
            const benchmarkIndex = report.environment?.benchmarkIndex ?? null;
            console.log(`${name}:`, { benchmarkIndex, ...categories });
          }
          NODE

      - name: Upload staging acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-staging-acceptance-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7
