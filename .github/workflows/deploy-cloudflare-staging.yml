name: Deploy Cloudflare Staging

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  STAGING_BASE_URL: https://m7mdehab-site.m7mdehab.workers.dev

jobs:
  deploy-staging:
    name: Deploy and verify workers.dev staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build staging static artifact
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify staging artifact and noindex contract
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/profile.json
          test -f out/projects.json
          test -f out/services.json
          test -f out/writing.json
          test -f out/llms.txt
          test -f out/_headers
          grep -F 'https://:version.:subdomain.workers.dev/*' out/_headers
          grep -F 'X-Robots-Tag: noindex' out/_headers

          assert_export() {
            local file="$1"
            local directory_index="$2"
            local label="$3"
            if [ -f "$file" ]; then
              echo "$label: file form"
            elif [ -f "$directory_index" ]; then
              echo "$label: directory-index form"
            else
              echo "Missing $label export" >&2
              find out -maxdepth 6 -type f | sort
              exit 1
            fi
          }

          assert_export out/ar.html out/ar/index.html "Arabic homepage"
          assert_export out/writing.html out/writing/index.html "English writing hub"
          assert_export out/writing/when-to-trust-a-probabilistic-forecast.html out/writing/when-to-trust-a-probabilistic-forecast/index.html "English authority essay"
          assert_export out/ar/writing.html out/ar/writing/index.html "Arabic writing hub"
          assert_export out/ar/writing/when-to-trust-a-probabilistic-forecast.html out/ar/writing/when-to-trust-a-probabilistic-forecast/index.html "Arabic authority essay"

      - name: Deploy to Cloudflare staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.130.0 deploy --config wrangler.static.jsonc

      - name: Verify live staging routes, headers, and canonical isolation
        shell: bash
        run: |
          set -euo pipefail

          ready=0
          consecutive_200=0
          last_status=unset

          for attempt in {1..45}; do
            status="$(
              curl --silent --show-error --location \
                --dump-header /tmp/staging-headers-candidate.txt \
                --output /tmp/staging-home-candidate.html \
                --write-out '%{http_code}' \
                "$STAGING_BASE_URL/" || true
            )"
            last_status="${status:-curl-error}"
            echo "Staging readiness attempt ${attempt}: HTTP ${last_status}"

            if [ "$status" = "200" ]; then
              consecutive_200=$((consecutive_200 + 1))
              cp /tmp/staging-headers-candidate.txt /tmp/staging-headers.txt
              cp /tmp/staging-home-candidate.html /tmp/staging-home.html

              if [ "$consecutive_200" -ge 3 ]; then
                ready=1
                break
              fi
            else
              consecutive_200=0
            fi

            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            echo "Staging origin did not stabilize at HTTP 200: $STAGING_BASE_URL (last status: $last_status)" >&2
            if [ -f /tmp/staging-headers-candidate.txt ]; then
              echo "--- last response headers ---" >&2
              tr -d '\r' < /tmp/staging-headers-candidate.txt >&2 || true
            fi
            if [ -f /tmp/staging-home-candidate.html ]; then
              echo "--- last response body (first 800 bytes) ---" >&2
              head -c 800 /tmp/staging-home-candidate.html >&2 || true
              echo >&2
            fi
            exit 1
          fi

          tr -d '\r' < /tmp/staging-headers.txt > /tmp/staging-headers-normalized.txt
          grep -Eiq '^x-robots-tag:.*noindex' /tmp/staging-headers-normalized.txt
          grep -Eiq '^x-frame-options:[[:space:]]*DENY' /tmp/staging-headers-normalized.txt
          grep -Eiq '^x-content-type-options:[[:space:]]*nosniff' /tmp/staging-headers-normalized.txt
          grep -Eiq '^referrer-policy:[[:space:]]*strict-origin-when-cross-origin' /tmp/staging-headers-normalized.txt

          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('/tmp/staging-home.html', 'utf8');
          if (!html.includes('<link rel="canonical" href="https://m7mdehab.com"')) {
            throw new Error('Homepage canonical is not the production apex URL');
          }
          if (html.includes('<link rel="canonical" href="https://m7mdehab-site.m7mdehab.workers.dev"')) {
            throw new Error('Staging workers.dev URL must never become canonical');
          }
          NODE

          routes=(
            "/"
            "/work/presaira"
            "/work/opportunityos"
            "/work/ghareeb-oglu"
            "/work/oil-spill-detection"
            "/work/solar-site-selection"
            "/work/makhbazy"
            "/writing"
            "/writing/when-to-trust-a-probabilistic-forecast"
            "/writing/why-accuracy-is-not-enough-for-oil-spill-detection"
            "/writing/what-an-ai-agent-should-do-when-evidence-is-missing"
            "/ar"
            "/ar/work/presaira"
            "/ar/work/opportunityos"
            "/ar/work/ghareeb-oglu"
            "/ar/work/oil-spill-detection"
            "/ar/work/solar-site-selection"
            "/ar/work/makhbazy"
            "/ar/writing"
            "/ar/writing/when-to-trust-a-probabilistic-forecast"
            "/ar/writing/why-accuracy-is-not-enough-for-oil-spill-detection"
            "/ar/writing/what-an-ai-agent-should-do-when-evidence-is-missing"
            "/profile.json"
            "/projects.json"
            "/services.json"
            "/writing.json"
            "/llms.txt"
            "/robots.txt"
            "/sitemap.xml"
          )

          for route in "${routes[@]}"; do
            echo "Checking staged ${route}"
            curl --fail --silent --show-error "$STAGING_BASE_URL${route}" > /dev/null
          done

      - name: Install Chromium for deployed-origin acceptance
        run: npx playwright install --with-deps chromium

      - name: Playwright rendered and accessibility QA against staging
        env:
          BASE_URL: ${{ env.STAGING_BASE_URL }}
        run: npm run test:browser

      - name: Lighthouse staging baseline
        shell: bash
        run: |
          mkdir -p artifacts/staging-lighthouse
          npx lighthouse "$STAGING_BASE_URL/" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/staging-lighthouse/home.json || true
          npx lighthouse "$STAGING_BASE_URL/work/presaira" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/staging-lighthouse/presaira.json || true
          npx lighthouse "$STAGING_BASE_URL/ar" --quiet --chrome-flags="--headless --no-sandbox" --output=json --output-path=artifacts/staging-lighthouse/ar-home.json || true
          node - <<'NODE'
          const fs = require('fs');
          for (const name of ['home', 'presaira', 'ar-home']) {
            const file = `artifacts/staging-lighthouse/${name}.json`;
            if (!fs.existsSync(file)) continue;
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            const categories = Object.fromEntries(
              Object.entries(report.categories).map(([key, value]) => [
                key,
                Math.round((value.score ?? 0) * 100),
              ]),
            );
            const benchmarkIndex = report.environment?.benchmarkIndex ?? null;
            console.log(`${name}:`, { benchmarkIndex, ...categories });
          }
          NODE

      - name: Upload staging acceptance artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-staging-acceptance-${{ github.sha }}
          path: artifacts
          if-no-files-found: warn
          retention-days: 7