name: Application CI

on:
  push:
    branches: [main, "iteration-*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Smoke-test production routes
        shell: bash
        run: |
          npm run start -- -H 127.0.0.1 -p 3000 > /tmp/m7mdehab-next.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT

          ready=0
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat /tmp/m7mdehab-next.log
            exit 1
          fi

          routes=(
            "/"
            "/work/presaira"
            "/work/opportunityos"
            "/work/ghareeb-oglu"
            "/work/oil-spill-detection"
            "/work/solar-site-selection"
            "/work/makhbazy"
            "/llms.txt"
            "/profile.json"
            "/projects.json"
          )

          for route in "${routes[@]}"; do
            echo "Checking ${route}"
            curl --fail --silent --show-error "http://127.0.0.1:3000${route}" > /dev/null
          done
