name: Deployment Readiness

on:
  push:
    branches:
      - iteration-9-production-deployment-soft-launch
  pull_request:
    branches:
      - main

concurrency:
  group: deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  cloudflare-static-export:
    name: Cloudflare static export + Vinext probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify exported launch surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/profile.json
          test -f out/projects.json
          test -f out/services.json
          test -f out/writing.json
          test -f out/llms.txt
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/_headers

          assert_export() {
            local file="$1"
            local directory_index="$2"
            local label="$3"
            if [ -f "$file" ]; then
              echo "$label: file form"
            elif [ -f "$directory_index" ]; then
              echo "$label: directory-index form"
            else
              echo "Missing $label export" >&2
              find out -maxdepth 6 -type f | sort
              exit 1
            fi
          }

          assert_export out/work/presaira.html out/work/presaira/index.html "English Presaira case study"
          assert_export out/ar.html out/ar/index.html "Arabic homepage"
          assert_export out/ar/work/presaira.html out/ar/work/presaira/index.html "Arabic Presaira case study"
          assert_export out/writing.html out/writing/index.html "English writing hub"
          assert_export out/writing/when-to-trust-a-probabilistic-forecast.html out/writing/when-to-trust-a-probabilistic-forecast/index.html "English authority essay"
          assert_export out/ar/writing.html out/ar/writing/index.html "Arabic writing hub"
          assert_export out/ar/writing/when-to-trust-a-probabilistic-forecast.html out/ar/writing/when-to-trust-a-probabilistic-forecast/index.html "Arabic authority essay"

      - name: Verify preview Wrangler packaging without deploying
        run: npx --yes wrangler@4.130.0 deploy --dry-run --config wrangler.static.jsonc

      - name: Verify production Wrangler configuration without deploying
        run: npx --yes wrangler@4.130.0 deploy --dry-run --config wrangler.production.jsonc

      - name: Verify production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low

      # Advisory future-runtime compatibility only. It deliberately reuses this
      # runner after mandatory static-production checks have passed.
      - name: Vinext future-runtime probe
        continue-on-error: true
        timeout-minutes: 8
        run: npx --yes vinext@1.0.0-beta.9 check