name: Deployment Readiness

on:
  push:
    branches:
      - iteration-9-production-deployment-soft-launch
  pull_request:
    branches:
      - main

concurrency:
  group: deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  cloudflare-static-export:
    name: Cloudflare static export + Vinext probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify English-only exported launch surface
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/profile.json
          test -f out/projects.json
          test -f out/services.json
          test -f out/writing.json
          test -f out/llms.txt
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/_headers

          assert_export() {
            local file="$1"
            local directory_index="$2"
            local label="$3"
            if [ -f "$file" ]; then
              echo "$label: file form"
            elif [ -f "$directory_index" ]; then
              echo "$label: directory-index form"
            else
              echo "Missing $label export" >&2
              find out -maxdepth 6 -type f | sort
              exit 1
            fi
          }

          assert_absent() {
            local file="$1"
            local directory_index="$2"
            local label="$3"
            if [ -f "$file" ] || [ -f "$directory_index" ]; then
              echo "Unexpected retired $label export" >&2
              exit 1
            fi
          }

          assert_export out/about.html out/about/index.html "English About"
          assert_export out/work.html out/work/index.html "English work directory"
          assert_export out/services.html out/services/index.html "English services"
          assert_export out/writing.html out/writing/index.html "English writing hub"

          project_slugs=(presaira opportunityos ghareeb-oglu oil-spill-detection solar-site-selection makhbazy)
          for slug in "${project_slugs[@]}"; do
            assert_export "out/work/${slug}.html" "out/work/${slug}/index.html" "English project ${slug}"
          done

          article_slugs=(
            when-to-trust-a-probabilistic-forecast
            why-accuracy-is-not-enough-for-oil-spill-detection
            what-an-ai-agent-should-do-when-evidence-is-missing
          )
          for slug in "${article_slugs[@]}"; do
            assert_export "out/writing/${slug}.html" "out/writing/${slug}/index.html" "English article ${slug}"
          done

          assert_absent out/ar.html out/ar/index.html "Arabic homepage"
          assert_absent out/ar/about.html out/ar/about/index.html "Arabic About"
          assert_absent out/ar/work.html out/ar/work/index.html "Arabic work directory"
          assert_absent out/ar/services.html out/ar/services/index.html "Arabic services"
          assert_absent out/ar/writing.html out/ar/writing/index.html "Arabic writing hub"
          assert_absent out/prototypes.html out/prototypes/index.html "prototype index"
          assert_absent out/prototypes/cinematic.html out/prototypes/cinematic/index.html "cinematic prototype"
          assert_absent out/prototypes/spatial.html out/prototypes/spatial/index.html "spatial prototype"
          assert_absent out/prototypes/kinetic.html out/prototypes/kinetic/index.html "kinetic prototype"

          if grep -Fq '/ar' out/sitemap.xml; then
            echo "Sitemap still exposes Arabic routes" >&2
            exit 1
          fi
          if grep -Fq '/prototypes' out/sitemap.xml; then
            echo "Sitemap exposes retired prototype routes" >&2
            exit 1
          fi
          test "$(grep -o '<url>' out/sitemap.xml | wc -l | tr -d ' ')" = "14"

      - name: Verify preview Wrangler packaging without deploying
        run: npx --yes wrangler@4.130.0 deploy --dry-run --config wrangler.static.jsonc

      - name: Verify production Wrangler configuration without deploying
        run: npx --yes wrangler@4.130.0 deploy --dry-run --config wrangler.production.jsonc

      - name: Verify production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low

      - name: Vinext future-runtime probe
        continue-on-error: true
        timeout-minutes: 8
        run: npx --yes vinext@1.0.0-beta.9 check
