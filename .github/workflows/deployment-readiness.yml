name: Deployment Readiness

on:
  push:
    branches:
      - iteration-9-production-deployment-soft-launch
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  cloudflare-static-export:
    name: Cloudflare static export
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify exported launch surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/profile.json
          test -f out/projects.json
          test -f out/services.json
          test -f out/llms.txt
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/_headers
          if [ -f out/work/presaira.html ]; then
            echo "case study export: file form"
          elif [ -f out/work/presaira/index.html ]; then
            echo "case study export: directory-index form"
          else
            echo "Missing Presaira case-study export" >&2
            find out -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Verify Wrangler packaging without deploying
        run: npx --yes wrangler@4.130.0 deploy --dry-run --config wrangler.static.jsonc

  vinext-compatibility:
    name: Vinext compatibility probe
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check current Next.js application against Cloudflare vinext
        run: npx --yes vinext@1.0.0-beta.9 check
