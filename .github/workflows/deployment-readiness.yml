name: Deployment Readiness

on:
  push:
    branches:
      - iteration-9-production-deployment-soft-launch
  pull_request:
    branches:
      - main

concurrency:
  group: deployment-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  cloudflare-static-export:
    name: Cloudflare static export + Vinext probe
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static export
        run: CLOUDFLARE_STATIC_EXPORT=1 npm run build

      - name: Verify exported launch surfaces
        shell: bash
        run: |
          set -euo pipefail
          test -f out/index.html
          test -f out/profile.json
          test -f out/projects.json
          test -f out/services.json
          test -f out/llms.txt
          test -f out/robots.txt
          test -f out/sitemap.xml
          test -f out/_headers
          if [ -f out/work/presaira.html ]; then
            echo "case study export: file form"
          elif [ -f out/work/presaira/index.html ]; then
            echo "case study export: directory-index form"
          else
            echo "Missing Presaira case-study export" >&2
            find out -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Verify preview Wrangler packaging without deploying
        run: npx --yes wrangler@4.130.0 deploy --dry-run --config wrangler.static.jsonc

      - name: Verify production Wrangler configuration without deploying
        run: npx --yes wrangler@4.130.0 deploy --dry-run --config wrangler.production.jsonc

      - name: Verify production dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=low

      # This was previously a second hosted job that repeated checkout, Node
      # setup, and npm ci. Keep it advisory and non-blocking, and run it only
      # after mandatory deployment-readiness checks have produced their verdict.
      - name: Vinext future-runtime probe
        continue-on-error: true
        timeout-minutes: 8
        run: npx --yes vinext@1.0.0-beta.9 check
