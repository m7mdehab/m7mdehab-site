name: One-time dependency security refresh
on:
  push:
    branches:
      - task/reciprocal-tutoring-authority-links-20261021
    paths:
      - ".github/workflows/one-time-dependency-refresh.yml"

permissions:
  contents: write

jobs:
  regenerate-lockfile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout the feature branch
        uses: actions/checkout@v7
        with:
          persist-credentials: true
          ref: task/reciprocal-tutoring-authority-links-20261021
      - name: Set up Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Upgrade Next.js to patched release and regenerate npm lockfile
        run: npm install next@16.4.2 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Apply safe, in-range transitive fixes to regenerated lockfile
        run: npm audit fix --package-lock-only --ignore-scripts --no-fund
      - name: Verify clean installation and absence of production dependency advisories
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm audit --omit=dev --audit-level=low
          node - <<'NODE'
          const fs=require('node:fs');
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          if(pkg.dependencies.next!=='16.4.2') throw Error('Unexpected patched Next.js version');
          for(const p of ['next','sharp','source-map-js']){
            const item=lock.packages['node_modules/'+p];
            if(!item) throw Error('Missing '+p+' dependency');
            console.log(p,item.version);
          }
          NODE
      - name: Commit regenerated manifests to the same feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git diff --cached --quiet && { echo "No dependency changes generated"; exit 1; }
          git commit -m "chore(deps): patch Next.js and refresh audited production lockfile"
          git push origin HEAD:task/reciprocal-tutoring-authority-links-20261021
