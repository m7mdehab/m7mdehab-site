name: Iteration 6 Lockfile Bootstrap

on:
  push:
    branches: [iteration-6-production-hardening]

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: iteration-6-production-hardening

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate exact npm lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Commit lockfile when missing or changed
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- package-lock.json)" ]; then
            echo "package-lock.json is already current"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: commit deterministic npm lockfile"
          git push origin HEAD:iteration-6-production-hardening
